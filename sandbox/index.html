<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" id="tm-viewport" />
    <title>Breakpoint — system design load simulator</title>
    <meta
      name="description"
      content="Compose a system architecture, run a traffic scenario, and watch real queueing-theory metrics propagate through it."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%239333ea'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M7 13h9' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M16 19h9' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23f04434' stroke='%23fff' stroke-width='1.3'/%3E%3C/svg%3E"
    />
    <style>
      /* Portrait phones: ask for landscape — the tool needs the width. */
      #tm-rotate {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px;
        text-align: center;
        background: #0b0e14;
        color: #e6e9ef;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #tm-rotate.on {
        display: flex;
      }
      #tm-rotate svg {
        width: 54px;
        height: 54px;
        margin-bottom: 16px;
        color: #5b8def;
        animation: tm-rot 2.6s ease-in-out infinite;
      }
      @keyframes tm-rot {
        0%,
        50% {
          transform: rotate(0);
        }
        68%,
        100% {
          transform: rotate(-90deg);
        }
      }
      #tm-rotate h2 {
        margin: 0 0 6px;
        font-size: 17px;
        font-weight: 620;
      }
      #tm-rotate p {
        margin: 0 0 20px;
        max-width: 300px;
        font-size: 13.5px;
        line-height: 1.55;
        color: #9aa4b2;
      }
      #tm-rotate button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        font: inherit;
        font-size: 14px;
        font-weight: 560;
        color: #fff;
        background: #3b6fe0;
      }
      #tm-rotate a {
        margin-top: 14px;
        font-size: 12.5px;
        color: #6b7688;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      @media (prefers-color-scheme: light) {
        #tm-rotate {
          background: #f3f5f8;
          color: #1b2230;
        }
        #tm-rotate p {
          color: #5a6479;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="tm-rotate" role="dialog" aria-label="Rotate your device">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="2" width="16" height="20" rx="2.5" />
        <path d="M9 19h6" />
      </svg>
      <h2>Rotate to landscape</h2>
      <p>The sandbox — canvas, panels and the metrics drawer — needs the width. Turn your phone sideways.</p>
      <button type="button" data-rotate>Go landscape</button>
      <a href="#" data-dismiss>Stay in portrait</a>
    </div>

    <script>
      // The sandbox is a desktop-scale tool. On phones:
      //   • landscape / dismissed  → render at desktop width (1280), pan + zoom
      //   • portrait               → ask the reader to rotate (device-width overlay)
      // Runs before the React module (which is deferred), so there is no reflow.
      (function () {
        var vp = document.getElementById('tm-viewport');
        var el = document.getElementById('tm-rotate');
        var isPhone =
          window.matchMedia('(pointer: coarse)').matches &&
          Math.min(screen.width, screen.height) <= 820;
        if (!isPhone) return;

        var dismissed = false;
        try {
          dismissed = sessionStorage.getItem('tm-rotate-dismissed') === '1';
        } catch (e) {}

        function isPortrait() {
          // Aspect ratio is the reliable signal — screen.orientation.type can
          // lie once a fixed-width viewport is in play.
          return window.innerHeight > window.innerWidth * 1.1;
        }
        function sync() {
          var rotate = isPortrait() && !dismissed;
          el.classList.toggle('on', rotate);
          vp.setAttribute(
            'content',
            rotate ? 'width=device-width, initial-scale=1' : 'width=1280',
          );
        }

        el.querySelector('[data-dismiss]').addEventListener('click', function (e) {
          e.preventDefault();
          dismissed = true;
          try {
            sessionStorage.setItem('tm-rotate-dismissed', '1');
          } catch (e2) {}
          sync();
        });

        el.querySelector('[data-rotate]').addEventListener('click', function () {
          // Best effort — only Android Chrome honours orientation.lock, and only
          // in fullscreen. Elsewhere the reader rotates manually and the hint
          // clears itself on the orientationchange event.
          var d = document.documentElement;
          var fs = d.requestFullscreen ? d.requestFullscreen() : Promise.reject();
          fs
            .then(function () {
              if (screen.orientation && screen.orientation.lock) {
                return screen.orientation.lock('landscape');
              }
            })
            .catch(function () {});
        });

        window.addEventListener('resize', sync);
        window.addEventListener('orientationchange', function () {
          setTimeout(sync, 150);
        });
        sync();
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
